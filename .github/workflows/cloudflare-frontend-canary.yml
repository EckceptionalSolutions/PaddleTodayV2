name: Paddle Today Frontend Canary
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: 'Exact tested source commit; never changes production domains'
        type: string
        required: true
concurrency:
  group: paddletoday-frontend-canary
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      FRONTEND_DEPLOYMENT_STAGE: canary
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://paddletoday.com
      AZURE_STORAGE_ACCOUNT: paddletoday
      AZURE_ASSET_CONTAINER: web-assets
      PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
      PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_FEATURE_TRIP_APP_HANDOFF: ${{ vars.PUBLIC_FEATURE_TRIP_APP_HANDOFF || '0' }}
      PUBLIC_FEATURE_WEB_ACCOUNT_EXPERIENCE: ${{ vars.PUBLIC_FEATURE_WEB_ACCOUNT_EXPERIENCE || '0' }}
      PUBLIC_FEATURE_SAVED_ROUTE_SYNC_CLAIM: ${{ vars.PUBLIC_FEATURE_SAVED_ROUTE_SYNC_CLAIM || '0' }}
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID || 'ce97ebc3-44ba-4c12-898e-666c904bc6b6' }}
    steps:
      - name: Check source and dedicated publishing configuration
        run: |
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure CLOUDFLARE_WORKERS_API_TOKEN; do not expand the analytics token.'; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test proxy and hosting safeguards
        run: npx vitest run scripts/lib/api-proxy.test.ts scripts/lib/cloudflare-frontend.test.ts scripts/lib/frontend-capacity.test.ts
      - name: Prepare the same assets and frontend as the Azure release
        run: |
          npm run prebuild:app
          node scripts/static-assets.mjs prepare
      - name: Build and package the complete frontend
        run: |
          node scripts/assert-firebase-web-config.mjs
          npm run build:app
          cp staticwebapp.config.json dist/staticwebapp.config.json
          node scripts/static-assets.mjs package
          node scripts/prepare-cloudflare-frontend.mjs tmp/frontend
          node --import tsx scripts/audit-search-indexability.ts tmp/frontend
      - name: Verify externally hosted gallery and map assets
        run: node scripts/static-assets.mjs verify
      - name: Deploy the unrouted canary only
        run: |
          set -euo pipefail
          mkdir -p .local/frontend-hosting
          npx --yes wrangler@4.158.0 deploy --config infra/cloudflare/wrangler.canary.json | tee .local/frontend-hosting/canary-deploy.log
          node - <<'NODE' >> "$GITHUB_ENV"
          const fs = require('fs');
          const output = fs.readFileSync('.local/frontend-hosting/canary-deploy.log', 'utf8');
          const origin = output.match(/https:\/\/paddletoday-frontend-canary\.[a-z0-9-]+\.workers\.dev\b/)?.[0];
          if (!origin) throw new Error('No exact canary hostname was reported; do not assume publication succeeded.');
          console.log(`FRONTEND_CANARY_ORIGIN=${origin}`);
          NODE
      - name: Wait for the exact frontend revision and verify the deployed canary
        env:
          EXPECTED_FRONTEND_REVISION: ${{ env.SOURCE_REVISION }}
        run: |
          node --input-type=module - <<'NODE'
          const origin = process.env.FRONTEND_CANARY_ORIGIN;
          let ready = false;
          for (let attempt = 0; attempt < 18; attempt++) {
            try {
              const response = await fetch(`${origin}/.well-known/paddletoday-frontend-release.json`, {cache: 'no-store', signal: AbortSignal.timeout(10000)});
              if (response.ok && (await response.json()).sourceRevision === process.env.EXPECTED_FRONTEND_REVISION) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!ready) throw new Error('The expected frontend revision did not become available.');
          NODE
          node scripts/verify-frontend-canary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-canary-evidence
          path: .local/frontend-hosting/*
