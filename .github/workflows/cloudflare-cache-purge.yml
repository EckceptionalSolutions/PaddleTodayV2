name: Purge Cloudflare URL Cache

on:
  workflow_dispatch:
    inputs:
      urls_json:
        description: JSON array of exact https://paddletoday.com URLs to purge
        required: true
        type: string

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Purge exact URLs from Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_PURGE_URLS_JSON: ${{ inputs.urls_json }}
        run: node scripts/purge-cloudflare-url-cache.mjs
