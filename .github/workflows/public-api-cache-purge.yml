name: Purge selected public API cache

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Exact public river/river-group API paths, one per line (maximum 10; no query strings)'
        required: true
        type: string
        default: '/api/rivers/allagash-river-churchill-dam-umsaskis/trip.gpx'

permissions:
  contents: read

concurrency:
  group: public-api-cache-purge
  cancel-in-progress: false

jobs:
  purge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Purge exact public API URLs
        env:
          CACHE_PURGE_PATHS: ${{ inputs.paths }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/purge-public-api-cache.mjs
