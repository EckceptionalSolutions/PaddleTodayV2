name: PaddleToday Weekly Product Report

on:
  schedule:
    # Wednesday morning gives Search Console time to finalize the prior Sunday-Saturday week.
    - cron: "15 13 * * 3"
  workflow_dispatch:

concurrency:
  group: weekly-product-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/analytics.readonly
            https://www.googleapis.com/auth/webmasters.readonly
          workload_identity_provider: projects/378411608143/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: paddletoday-metrics@paddletoday-9933a.iam.gserviceaccount.com

      - name: Login to Azure when cost credentials are configured
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Build weekly product report
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GOOGLE_ANALYTICS_PROPERTY_ID: ${{ vars.GOOGLE_ANALYTICS_PROPERTY_ID || '538058487' }}
          SEARCH_CONSOLE_SITE_URL: ${{ vars.SEARCH_CONSOLE_SITE_URL || 'sc-domain:paddletoday.com' }}
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID || 'ce97ebc3-44ba-4c12-898e-666c904bc6b6' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          RIVER_ALERTS_CONTAINER_SAS_URL: ${{ secrets.RIVER_ALERTS_CONTAINER_SAS_URL }}
          RIVER_ALERTS_BLOB_PREFIX: ${{ vars.RIVER_ALERTS_BLOB_PREFIX || 'river-alerts' }}
          ROUTE_REQUESTS_CONTAINER_SAS_URL: ${{ secrets.ROUTE_REQUESTS_CONTAINER_SAS_URL }}
          ROUTE_REQUESTS_BLOB_PREFIX: ${{ vars.ROUTE_REQUESTS_BLOB_PREFIX || 'route-requests' }}
        run: |
          npm run metrics:weekly -- --output-dir reports/weekly
          cat reports/weekly/weekly-product-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload weekly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-product-report-${{ github.run_number }}
          path: reports/weekly/
          if-no-files-found: warn
          retention-days: 90
