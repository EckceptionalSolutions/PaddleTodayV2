name: Paddle Today API

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build:app

      - name: Create deploy package
        run: |
          mkdir deploy-package
          cp -R dist deploy-package/dist
          cp -R src deploy-package/src
          cp -R packages deploy-package/packages
          mkdir -p deploy-package/docs deploy-package/automations
          cp -R docs/operations deploy-package/docs/operations
          cp -R automations/route-control-plane deploy-package/automations/route-control-plane
          mkdir deploy-package/vendor
          npm pack ./packages/api-contract --pack-destination deploy-package/vendor
          npm pack ./packages/geo --pack-destination deploy-package/vendor
          npm pack ./packages/trip-pack --pack-destination deploy-package/vendor
          node -e "const fs = require('fs'); const pkg = require('./package.json'); fs.writeFileSync('deploy-package/package.json', JSON.stringify({ name: pkg.name, version: pkg.version, private: true, type: pkg.type, scripts: { start: 'if [ ! -x node_modules/.bin/tsx ] || [ ! -f node_modules/@paddletoday/api-contract/package.json ] || [ ! -f node_modules/@paddletoday/trip-pack/package.json ]; then npm install --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund || exit 1; fi; node_modules/.bin/tsx src/server/api-server.ts --static dist' }, dependencies: { '@azure/communication-email': pkg.dependencies['@azure/communication-email'], '@paddletoday/api-contract': 'file:vendor/paddletoday-api-contract-0.1.0.tgz', '@paddletoday/geo': 'file:vendor/paddletoday-geo-0.1.0.tgz', '@paddletoday/trip-pack': 'file:vendor/paddletoday-trip-pack-0.1.0.tgz', tsx: pkg.dependencies.tsx } }, null, 2) + '\n');"
          node -e "require('fs').writeFileSync('deploy-package/.deployment', '[config]\nSCM_DO_BUILD_DURING_DEPLOYMENT=true\n');"
          (cd deploy-package && npm install --workspaces=false --omit=dev --ignore-scripts --no-package-lock --no-audit --no-fund)
          test -f deploy-package/node_modules/@paddletoday/api-contract/package.json
          test ! -L deploy-package/node_modules/@paddletoday/api-contract
          test -f deploy-package/node_modules/@paddletoday/trip-pack/package.json
          test ! -L deploy-package/node_modules/@paddletoday/trip-pack

      - name: Verify packaged API starts
        run: |
          (
            cd deploy-package
            node node_modules/tsx/dist/cli.mjs src/server/api-server.ts --static dist --port 4322
          ) > deploy-package-startup.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid 2>/dev/null || true' EXIT

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:4322/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat deploy-package-startup.log
          exit 1

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: deploy-package

      - name: Smoke test deployment
        env:
          DEPLOYMENT_BASE_URL: ${{ secrets.AZURE_WEBAPP_URL || vars.API_ORIGIN || 'https://paddletodayapi-h7efgxcfg9h7gne9.centralus-01.azurewebsites.net' }}
          DEPLOYMENT_SMOKE_TIMEOUT_MS: '30000'
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm run deployment:smoke; then
              exit 0
            fi

            if [ "$attempt" -lt 8 ]; then
              echo "Deployment is not ready yet; retrying in 15 seconds."
              sleep 15
            fi
          done

          exit 1
