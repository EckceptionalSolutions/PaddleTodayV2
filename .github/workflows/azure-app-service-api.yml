name: Paddle Today API

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'packages/**'
      - 'automations/route-control-plane/**'
      - 'docs/operations/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/deployment-config.mjs'
      - 'scripts/lib/deployment-config.mjs'
      - 'scripts/emit-route-consolidation-redirects.mjs'
      - 'scripts/package-api.mjs'
      - 'scripts/lib/api-package.mjs'
      - 'scripts/lib/static-compression.mjs'
      - 'scripts/verify-api-package.mjs'
      - 'staticwebapp.config.json'
      - '.github/workflows/azure-app-service-api.yml'
  workflow_dispatch:

concurrency:
  group: paddletoday-api-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Allow time for package installation, upload, startup and readiness checks.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Check deployment configuration
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          AZUREAPPSERVICE_PUBLISHPROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        run: node scripts/deployment-config.mjs api

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: |
          npm run test:api
          npx vitest run scripts/lib/api-package.test.ts

      - name: Build app
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_FEATURE_TRIP_APP_HANDOFF: ${{ vars.PUBLIC_FEATURE_TRIP_APP_HANDOFF || '0' }}
          PUBLIC_FEATURE_WEB_ACCOUNT_EXPERIENCE: ${{ vars.PUBLIC_FEATURE_WEB_ACCOUNT_EXPERIENCE || '0' }}
          PUBLIC_FEATURE_SAVED_ROUTE_SYNC_CLAIM: ${{ vars.PUBLIC_FEATURE_SAVED_ROUTE_SYNC_CLAIM || '0' }}
        run: |
          node scripts/assert-firebase-web-config.mjs
          npm run build:app

      - name: Create deploy package
        run: |
          node scripts/package-api.mjs
          (cd deploy-package && npm install --workspaces=false --omit=dev --ignore-scripts --package-lock-only --no-audit --no-fund && npm ci --workspaces=false --omit=dev --ignore-scripts --no-audit --no-fund)

      - name: Verify packaged runtime and resources
        run: node scripts/verify-api-package.mjs deploy-package

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: deploy-package

      - name: Wait for deployment readiness
        env:
          DEPLOYMENT_BASE_URL: ${{ secrets.AZURE_WEBAPP_URL || vars.API_ORIGIN || 'https://paddletodayapi-h7efgxcfg9h7gne9.centralus-01.azurewebsites.net' }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
        run: |
          for attempt in $(seq 1 24); do
            capabilities="$(curl --silent --show-error --max-time 10 "${DEPLOYMENT_BASE_URL%/}/api/trips/capabilities" || true)"
            if printf '%s' "$capabilities" | node -e "let value='';process.stdin.on('data',chunk=>value+=chunk);process.stdin.on('end',()=>{try{const body=JSON.parse(value);process.exit(body.tripApiVersion===1&&body.trips===true&&body.firebaseAuthReady===true&&body.firebaseProjectId===process.env.PUBLIC_FIREBASE_PROJECT_ID&&body.tripStorageReady===true?0:1)}catch{process.exit(1)}})"; then
              account_status="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "${DEPLOYMENT_BASE_URL%/}/api/account" || true)"
              trip_status="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "${DEPLOYMENT_BASE_URL%/}/api/trips" || true)"
              if [ "$account_status" = '401' ] && [ "$trip_status" = '401' ]; then
                echo 'Account and trip routes, Firebase Admin, and private trip storage are ready.'
                exit 0
              fi
              echo "Trip API capability is ready, waiting for account/trip routes (account=$account_status, trips=$trip_status)."
            else
              echo 'Waiting for deployed trip API, Firebase Admin, and private storage to become ready.'
            fi
            sleep 10
          done

          echo 'The deployed account and trip API did not become fully ready within 4 minutes.'
          exit 1
      - name: Smoke test deployment
        env:
          DEPLOYMENT_BASE_URL: ${{ secrets.AZURE_WEBAPP_URL || vars.API_ORIGIN || 'https://paddletodayapi-h7efgxcfg9h7gne9.centralus-01.azurewebsites.net' }}
          DEPLOYMENT_SMOKE_TIMEOUT_MS: '180000'
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
        run: npm run deployment:smoke
