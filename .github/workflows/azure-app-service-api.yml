name: Paddle Today API

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'packages/**'
      - 'automations/route-control-plane/**'
      - 'docs/operations/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/deployment-config.mjs'
      - 'scripts/lib/deployment-config.mjs'
      - 'staticwebapp.config.json'
      - '.github/workflows/azure-app-service-api.yml'
  workflow_dispatch:

concurrency:
  group: paddletoday-api-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # OneDeploy may spend several minutes running the App Service Oryx build
    # after the package upload. Keep the job long enough to reach readiness
    # and smoke checks instead of timing out during a healthy deployment.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Check deployment configuration
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          AZUREAPPSERVICE_PUBLISHPROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        run: node scripts/deployment-config.mjs api

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api

      - name: Build app
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
        run: |
          node scripts/assert-firebase-web-config.mjs
          npm run build:app

      - name: Create deploy package
        run: |
          mkdir deploy-package
          cp -R dist deploy-package/dist
          cp -R src deploy-package/src
          cp -R packages deploy-package/packages
          mkdir -p deploy-package/docs deploy-package/automations
          cp -R docs/operations deploy-package/docs/operations
          cp -R automations/route-control-plane deploy-package/automations/route-control-plane
          mkdir deploy-package/vendor
          npm pack ./packages/api-contract --pack-destination deploy-package/vendor
          npm pack ./packages/geo --pack-destination deploy-package/vendor
          npm pack ./packages/trip-pack --pack-destination deploy-package/vendor
          node -e "const fs = require('fs'); const pkg = require('./package.json'); fs.writeFileSync('deploy-package/package.json', JSON.stringify({ name: pkg.name, version: pkg.version, private: true, type: pkg.type, engines: pkg.engines, scripts: { start: 'node_modules/.bin/tsx src/server/bootstrap.ts --static dist' }, dependencies: { '@azure/communication-email': pkg.dependencies['@azure/communication-email'], '@azure/monitor-opentelemetry': pkg.dependencies['@azure/monitor-opentelemetry'], '@paddletoday/api-contract': 'file:vendor/paddletoday-api-contract-0.1.0.tgz', '@paddletoday/geo': 'file:vendor/paddletoday-geo-0.1.0.tgz', '@paddletoday/trip-pack': 'file:vendor/paddletoday-trip-pack-0.1.0.tgz', 'firebase-admin': pkg.dependencies['firebase-admin'], sharp: pkg.dependencies.sharp, tsx: pkg.dependencies.tsx } }, null, 2) + '\n');"
          node -e "require('fs').writeFileSync('deploy-package/.deployment', '[config]\nSCM_DO_BUILD_DURING_DEPLOYMENT=true\n');"
          (cd deploy-package && npm install --workspaces=false --omit=dev --ignore-scripts --package-lock-only --no-audit --no-fund && npm ci --workspaces=false --omit=dev --ignore-scripts --no-audit --no-fund)
          test -f deploy-package/node_modules/@paddletoday/api-contract/package.json
          test ! -L deploy-package/node_modules/@paddletoday/api-contract
          test -f deploy-package/node_modules/@paddletoday/trip-pack/package.json
          test ! -L deploy-package/node_modules/@paddletoday/trip-pack

      - name: Verify packaged API starts
        run: |
          runtime_dir="$(mktemp -d)"
          cp -a deploy-package/. "$runtime_dir/"
          (
            cd "$runtime_dir"
            node node_modules/tsx/dist/cli.mjs src/server/bootstrap.ts --static dist --port 4322
          ) > "$RUNNER_TEMP/deploy-package-startup.log" 2>&1 &
          api_pid=$!
          trap 'kill $api_pid 2>/dev/null || true; rm -rf "$runtime_dir"' EXIT

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:4322/api/health > /dev/null; then
              break
            fi
            sleep 2
          done

          if ! curl --fail --silent --show-error http://127.0.0.1:4322/api/health > /dev/null; then
            cat "$RUNNER_TEMP/deploy-package-startup.log"
            exit 1
          fi

          account_status="$(curl --silent --show-error --output "$RUNNER_TEMP/account-route-response.json" --write-out '%{http_code}' http://127.0.0.1:4322/api/account)"
          if [ "$account_status" != '401' ]; then
            cat "$RUNNER_TEMP/deploy-package-startup.log"
            cat "$RUNNER_TEMP/account-route-response.json"
            echo "Expected the account route to reject an unauthenticated request with HTTP 401; received HTTP $account_status."
            exit 1
          fi

          trip_status="$(curl --silent --show-error --output "$RUNNER_TEMP/trip-route-response.json" --write-out '%{http_code}' http://127.0.0.1:4322/api/trips)"
          if [ "$trip_status" != '401' ]; then
            cat "$RUNNER_TEMP/deploy-package-startup.log"
            cat "$RUNNER_TEMP/trip-route-response.json"
            echo "Expected the trip route to reject an unauthenticated request with HTTP 401; received HTTP $trip_status."
            exit 1
          fi

          capability_status="$(curl --silent --show-error --output "$RUNNER_TEMP/trip-capabilities.json" --write-out '%{http_code}' http://127.0.0.1:4322/api/trips/capabilities)"
          if [ "$capability_status" != '200' ]; then
            cat "$RUNNER_TEMP/deploy-package-startup.log"
            cat "$RUNNER_TEMP/trip-capabilities.json"
            echo "Expected trip API capability and storage verification to return HTTP 200; received HTTP $capability_status."
            exit 1
          fi
          node -e "const c=require('$RUNNER_TEMP/trip-capabilities.json'); if(c.tripApiVersion!==1||c.trips!==true||c.tripStorageReady!==true) throw new Error('Trip API or storage check failed');"

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: deploy-package

      - name: Wait for deployment readiness
        env:
          DEPLOYMENT_BASE_URL: ${{ secrets.AZURE_WEBAPP_URL || vars.API_ORIGIN || 'https://paddletodayapi-h7efgxcfg9h7gne9.centralus-01.azurewebsites.net' }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
        run: |
          for attempt in $(seq 1 24); do
            capabilities="$(curl --silent --show-error --max-time 10 "${DEPLOYMENT_BASE_URL%/}/api/trips/capabilities" || true)"
            if printf '%s' "$capabilities" | node -e "let value='';process.stdin.on('data',chunk=>value+=chunk);process.stdin.on('end',()=>{try{const body=JSON.parse(value);process.exit(body.tripApiVersion===1&&body.trips===true&&body.firebaseAuthReady===true&&body.firebaseProjectId===process.env.PUBLIC_FIREBASE_PROJECT_ID&&body.tripStorageReady===true?0:1)}catch{process.exit(1)}})"; then
              account_status="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "${DEPLOYMENT_BASE_URL%/}/api/account" || true)"
              trip_status="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "${DEPLOYMENT_BASE_URL%/}/api/trips" || true)"
              if [ "$account_status" = '401' ] && [ "$trip_status" = '401' ]; then
                echo 'Account and trip routes, Firebase Admin, and private trip storage are ready.'
                exit 0
              fi
              echo "Trip API capability is ready, waiting for account/trip routes (account=$account_status, trips=$trip_status)."
            else
              echo 'Waiting for deployed trip API, Firebase Admin, and private storage to become ready.'
            fi
            sleep 10
          done

          echo 'The deployed account and trip API did not become fully ready within 4 minutes.'
          exit 1
      - name: Smoke test deployment
        env:
          DEPLOYMENT_BASE_URL: ${{ secrets.AZURE_WEBAPP_URL || vars.API_ORIGIN || 'https://paddletodayapi-h7efgxcfg9h7gne9.centralus-01.azurewebsites.net' }}
          DEPLOYMENT_SMOKE_TIMEOUT_MS: '180000'
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
        run: npm run deployment:smoke
