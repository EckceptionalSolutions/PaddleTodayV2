name: Paddle Today Frontend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'packages/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/sync-design-tokens.mjs'
      - 'scripts/sync-public-scripts.mjs'
      - 'scripts/generate-explore-map-overview.ts'
      - 'scripts/audit-search-indexability.ts'
      - 'scripts/search-serving-smoke.mjs'
      - 'scripts/lib/**'
      - 'staticwebapp.config.json'
      - '.github/workflows/azure-static-web-apps.yml'
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: 'Deploy the frontend after asset verification (disable to validate asset publishing only)'
        type: boolean
        default: true
      verify_existing_assets:
        description: 'Only verify already-published assets and legacy URLs; skip tests, build, upload and deployment'
        type: boolean
        default: false

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://paddletoday.com
      AZURE_STORAGE_ACCOUNT: paddletoday
      AZURE_ASSET_CONTAINER: web-assets
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID || 'ce97ebc3-44ba-4c12-898e-666c904bc6b6' }}
      PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
      PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_FEATURE_TRIP_APP_HANDOFF: ${{ vars.PUBLIC_FEATURE_TRIP_APP_HANDOFF || '0' }}
      PUBLIC_FEATURE_WEB_ACCOUNT_EXPERIENCE: ${{ vars.PUBLIC_FEATURE_WEB_ACCOUNT_EXPERIENCE || '0' }}
      PUBLIC_FEATURE_SAVED_ROUTE_SYNC_CLAIM: ${{ vars.PUBLIC_FEATURE_SAVED_ROUTE_SYNC_CLAIM || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Check deployment configuration
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: node scripts/deployment-config.mjs frontend

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_existing_assets
        run: npm test

      - name: Prepare versioned gallery and map assets
        run: |
          npm run prebuild:app
          node scripts/static-assets.mjs prepare

      - name: Build app
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_existing_assets
        run: |
          node scripts/assert-firebase-web-config.mjs
          npx astro build
          cp staticwebapp.config.json dist/staticwebapp.config.json
          node -e "const c = require('./dist/staticwebapp.config.json'); const h = c.globalHeaders || {}; if (h['Strict-Transport-Security'] !== 'max-age=31536000; includeSubDomains; preload' || h['Permissions-Policy'] !== 'geolocation=(self), microphone=(), camera=()') throw new Error('Static Web Apps security headers are not configured');"

      - name: Audit built search indexability
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_existing_assets
        run: node --import tsx scripts/audit-search-indexability.ts

      - name: Package frontend without gallery and map assets
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_existing_assets
        run: node scripts/static-assets.mjs package

      - name: Audit final frontend search indexability
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_existing_assets
        run: node --import tsx scripts/audit-search-indexability.ts tmp/frontend

      - name: Sign in to Azure for asset publishing
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_existing_assets
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Publish versioned assets and legacy paths
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_existing_assets
        run: node scripts/publish-static-assets.mjs

      - name: Verify public assets
        run: node scripts/static-assets.mjs verify

      - name: Verify mobile compatibility
        if: github.event_name != 'workflow_dispatch' || inputs.deploy_frontend || inputs.verify_existing_assets
        run: node scripts/static-asset-redirect.mjs verify

      - name: Wait for account, trip API, and private storage before publishing the website
        if: github.event_name != 'workflow_dispatch' || (inputs.deploy_frontend && !inputs.verify_existing_assets)
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN || 'https://paddletodayapi-h7efgxcfg9h7gne9.centralus-01.azurewebsites.net' }}
        run: |
          api_origin="${API_ORIGIN%/}"
          for attempt in $(seq 1 60); do
            account_status="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$api_origin/api/account" || true)"
            trip_status="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$api_origin/api/trips" || true)"
            capabilities="$(curl --silent --show-error --max-time 10 "$api_origin/api/trips/capabilities" || true)"
            if [ "$account_status" = '401' ] && [ "$trip_status" = '401' ] && printf '%s' "$capabilities" | node -e "let value='';process.stdin.on('data',chunk=>value+=chunk);process.stdin.on('end',()=>{try{const body=JSON.parse(value);process.exit(body.tripApiVersion===1&&body.trips===true&&body.firebaseAuthReady===true&&body.firebaseProjectId===process.env.PUBLIC_FIREBASE_PROJECT_ID&&body.tripStorageReady===true?0:1)}catch{process.exit(1)}})"; then
              echo 'Account and trip API routes and private storage are ready.'
              exit 0
            fi
            echo "Waiting for compatible API routes (account=$account_status, trips=$trip_status)."
            sleep 10
          done
          echo 'The website was not published because the account and trip API did not become ready.'
          exit 1

      - name: Deploy frontend to Azure Static Web Apps
        if: github.event_name != 'workflow_dispatch' || (inputs.deploy_frontend && !inputs.verify_existing_assets)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "tmp/frontend"
          skip_app_build: true

      - name: Verify deployed origin search page responses
        if: github.event_name != 'workflow_dispatch' || (inputs.deploy_frontend && !inputs.verify_existing_assets)
        env:
          DEPLOYMENT_ORIGIN_HOST: jolly-river-0d74c2110.1.azurestaticapps.net
        run: node scripts/search-serving-smoke.mjs
