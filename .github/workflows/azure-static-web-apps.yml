name: Paddle Today Frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: 'Deploy the frontend after asset verification (disable to validate asset publishing only)'
        type: boolean
        default: true
      verify_existing_assets:
        description: 'Only verify already-published assets and legacy URLs; skip tests, build, upload and deployment'
        type: boolean
        default: false

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://paddletoday.com
      AZURE_STORAGE_ACCOUNT: paddletoday
      AZURE_ASSET_CONTAINER: web-assets
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID || 'ce97ebc3-44ba-4c12-898e-666c904bc6b6' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Check deployment configuration
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: node scripts/deployment-config.mjs frontend

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_existing_assets
        run: npm test

      - name: Prepare versioned gallery and map assets
        run: |
          npm run prebuild:app
          node scripts/static-assets.mjs prepare

      - name: Build app
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_existing_assets
        run: |
          npx astro build
          cp staticwebapp.config.json dist/staticwebapp.config.json
          node -e "const c = require('./dist/staticwebapp.config.json'); const h = c.globalHeaders || {}; if (h['Strict-Transport-Security'] !== 'max-age=31536000; includeSubDomains; preload') throw new Error('Static Web Apps security headers are not configured');"

      - name: Package frontend without gallery and map assets
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_existing_assets
        run: node scripts/static-assets.mjs package

      - name: Sign in to Azure for asset publishing
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_existing_assets
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Publish versioned assets and legacy paths
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_existing_assets
        run: node scripts/publish-static-assets.mjs

      - name: Verify public assets
        run: node scripts/static-assets.mjs verify

      - name: Verify mobile compatibility
        if: github.event_name != 'workflow_dispatch' || inputs.deploy_frontend || inputs.verify_existing_assets
        run: node scripts/static-asset-redirect.mjs verify

      - name: Deploy frontend to Azure Static Web Apps
        if: github.event_name != 'workflow_dispatch' || (inputs.deploy_frontend && !inputs.verify_existing_assets)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "tmp/frontend"
          skip_app_build: true
