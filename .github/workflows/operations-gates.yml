name: Operations gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: operations-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gatekeeper:
    name: Evidence, safety, tests, rollback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out change
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run operations gatekeeper
        run: npm run operations:verify

      - name: Publish gate summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const runs = JSON.parse(fs.readFileSync('docs/operations/runs.json', 'utf8')).runs;
          const run = [...runs].reverse().find((item) => item.kind === 'gatekeeper_verification');
          console.log('## Operations gatekeeper');
          console.log(`**Status:** ${run?.status ?? 'not recorded'}`);
          for (const gate of run?.gates ?? []) console.log(`- ${gate.passed ? '✅' : '❌'} **${gate.id}** — ${gate.detail}`);
          NODE

      - name: Upload gate record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-gate-record
          path: docs/operations/runs.json

  enable-auto-merge:
    name: Enable auto-merge after gates
    needs: gatekeeper
    if: needs.gatekeeper.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash --delete-branch
