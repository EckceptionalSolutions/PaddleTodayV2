name: Paddle Today Android Preview Build

on:
  workflow_dispatch:

concurrency:
  group: android-preview-local
  cancel-in-progress: false

jobs:
  build_android_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      EXPO_PUBLIC_API_BASE_URL: https://paddletoday.com
      EXPO_PUBLIC_APP_ENV: preview
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/apps/mobile/artifacts
      GRADLE_OPTS: -Dorg.gradle.caching=true
      CCACHE_DIR: ${{ runner.temp }}/ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Install native compiler cache
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache

      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-preview-ccache-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-android-preview-ccache-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-android-preview-ccache-

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release readiness
        run: npm run mobile:release-check

      - name: Typecheck mobile app
        run: npm run mobile:typecheck

      - name: Build Android preview APK
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --local --non-interactive

      - name: Report native compiler cache
        if: always()
        run: ccache --show-stats

      - name: Upload Android preview APK
        uses: actions/upload-artifact@v4
        with:
          name: paddletoday-android-preview
          path: apps/mobile/artifacts/*
          if-no-files-found: error
