name: Paddle Today Snapshot Worker

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/**'
      - 'src/data/**'
      - 'src/server/river-snapshot.ts'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/deployment-config.mjs'
      - 'scripts/lib/deployment-config.mjs'
      - 'scripts/snapshot-worker-validate.sh'
      - 'infra/azure/container-apps-platform.bicep'
      - 'infra/azure/container-apps-job.bicep'
      - 'infra/azure/snapshot-worker/**'
      - '.github/workflows/azure-container-apps-snapshot-worker.yml'
  workflow_dispatch:
    inputs:
      provision_monitoring:
        description: 'Also provision monitoring (requires an identity with monitoring write permissions)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paddletoday-snapshot-worker-production
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: paddletoday
  AZURE_CONTAINER_REGISTRY: paddletodayjobs
  AZURE_CONTAINER_APPS_ENVIRONMENT: paddletoday-jobs
  AZURE_CONTAINER_APPS_JOB: paddletoday-river-snapshots
  IMAGE_NAME: paddletoday/snapshot-worker
  PROVISION_SNAPSHOT_MONITORING: ${{ inputs.provision_monitoring && 'true' || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Check deployment configuration
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          SNAPSHOT_SAS_URL: ${{ secrets.RIVER_SNAPSHOT_CONTAINER_SAS_URL }}
        run: node scripts/deployment-config.mjs snapshot

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Provision Container Apps platform
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/container-apps-platform.bicep \
            --parameters \
              containerRegistryName="$AZURE_CONTAINER_REGISTRY" \
              containerAppsEnvironmentName="$AZURE_CONTAINER_APPS_ENVIRONMENT" \
            --output none

      - name: Validate worker deployment permissions before building
        env:
          SNAPSHOT_SAS_URL: ${{ secrets.RIVER_SNAPSHOT_CONTAINER_SAS_URL }}
          SNAPSHOT_ALERT_EMAIL: ${{ vars.SNAPSHOT_ALERT_EMAIL || 'hello@paddletoday.com' }}
        run: bash scripts/snapshot-worker-validate.sh

      - name: Build worker image in Azure Container Registry
        run: |
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --image "$IMAGE_NAME:$GITHUB_SHA" \
            --file infra/azure/snapshot-worker/Dockerfile \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            .

      - name: Deploy scheduled Container Apps Job
        env:
          SNAPSHOT_SAS_URL: ${{ secrets.RIVER_SNAPSHOT_CONTAINER_SAS_URL }}
          SNAPSHOT_ALERT_EMAIL: ${{ vars.SNAPSHOT_ALERT_EMAIL || 'hello@paddletoday.com' }}
        run: |
          az deployment group create \
            --mode Incremental \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/container-apps-job.bicep \
            --parameters \
              containerRegistryName="$AZURE_CONTAINER_REGISTRY" \
              containerAppsEnvironmentName="$AZURE_CONTAINER_APPS_ENVIRONMENT" \
              jobName="$AZURE_CONTAINER_APPS_JOB" \
              snapshotAlertEmail="$SNAPSHOT_ALERT_EMAIL" \
              provisionMonitoring="$PROVISION_SNAPSHOT_MONITORING" \
              snapshotContainerSasUrl="$SNAPSHOT_SAS_URL" \
              image="$AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_NAME:$GITHUB_SHA" \
            --output none

      - name: Start one verification execution
        run: |
          az containerapp job start \
            --name "$AZURE_CONTAINER_APPS_JOB" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output none
