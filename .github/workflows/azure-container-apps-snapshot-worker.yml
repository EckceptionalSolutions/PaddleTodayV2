name: Paddle Today Snapshot Worker
run-name: Paddle Today Snapshot Worker · ${{ inputs.source_revision || github.sha }} · deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/lib/**'
      - 'src/data/**'
      - 'src/server/river-snapshot.ts'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/deployment-config.mjs'
      - 'scripts/lib/deployment-config.mjs'
      - 'scripts/snapshot-worker-deployment.sh'
      - 'scripts/wait-for-snapshot-execution.mjs'
      - 'scripts/lib/snapshot-execution.mjs'
      - 'scripts/wait-for-snapshot-reader.mjs'
      - 'scripts/lib/snapshot-reader-readiness.mjs'
      - 'infra/azure/container-apps-platform.bicep'
      - 'infra/azure/container-apps-job.bicep'
      - 'infra/azure/snapshot-worker/**'
      - '.github/workflows/azure-container-apps-snapshot-worker.yml'
  workflow_dispatch:
    inputs:
      source_revision:
        description: 'Exact source commit (defaults to this workflow run revision)'
        type: string
        default: ''
      reuse_image:
        description: 'Require an existing GHCR commit tag, for rollback without rebuilding'
        type: boolean
        default: false
      provision_monitoring:
        description: 'Also provision monitoring (requires an identity with monitoring write permissions)'
        type: boolean
        default: false
      detail_layout:
        description: 'Use legacy to roll back per-route writes before rolling back the API reader'
        type: choice
        options:
          - detail-buckets-v1
          - legacy
        default: detail-buckets-v1

permissions:
  contents: read
  packages: write

concurrency:
  group: paddletoday-snapshot-worker-production
  cancel-in-progress: false

env:
  SOURCE_REVISION: ${{ inputs.source_revision || github.sha }}
  AZURE_RESOURCE_GROUP: paddletoday
  AZURE_CONTAINER_APPS_ENVIRONMENT: paddletoday-jobs
  AZURE_CONTAINER_APPS_JOB: paddletoday-river-snapshots
  SNAPSHOT_IMAGE_REPOSITORY: ghcr.io/eckceptionalsolutions/paddletoday-snapshot-worker
  GHCR_PULL_USERNAME: ${{ github.repository_owner }}
  REQUIRE_EXISTING_IMAGE: ${{ inputs.reuse_image && 'true' || 'false' }}
  PROVISION_SNAPSHOT_MONITORING: ${{ inputs.provision_monitoring && 'true' || 'false' }}
  SNAPSHOT_DETAIL_LAYOUT: ${{ inputs.detail_layout || 'detail-buckets-v1' }}
  SNAPSHOT_API_ORIGIN: ${{ vars.API_ORIGIN || 'https://paddletodayapi-h7efgxcfg9h7gne9.centralus-01.azurewebsites.net' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate pinned source revision
        run: '[[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]] || { echo "Expected a full source commit SHA"; exit 1; }'
      - name: Checkout deployment controls
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned worker source
        if: '!inputs.reuse_image'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
          path: snapshot-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.dockerignore
            /infra/azure/snapshot-worker/
            /packages/api-contract/
            /packages/geo/
            /src/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Check deployment configuration
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          SNAPSHOT_SAS_URL: ${{ secrets.RIVER_SNAPSHOT_CONTAINER_SAS_URL }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: node scripts/deployment-config.mjs snapshot

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Provision Container Apps platform
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/azure/container-apps-platform.bicep \
            --parameters containerAppsEnvironmentName="$AZURE_CONTAINER_APPS_ENVIRONMENT" \
            --output none

      - name: Wait for a compatible API reader before enabling batched writes
        run: node scripts/wait-for-snapshot-reader.mjs

      - name: Publish or resolve a pinned worker image in GHCR
        env:
          GHCR_WRITE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_WRITE_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          tag="$SNAPSHOT_IMAGE_REPOSITORY:$SOURCE_REVISION"
          manifest="$RUNNER_TEMP/snapshot-image-manifest.txt"
          if ! docker buildx imagetools inspect "$tag" > "$manifest"; then
            if [ "$REQUIRE_EXISTING_IMAGE" = true ]; then
              echo 'The requested rollback image must already exist in GHCR.'
              exit 1
            fi
            docker buildx build --push --platform linux/amd64 --provenance=false \
              --file snapshot-source/infra/azure/snapshot-worker/Dockerfile \
              --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --tag "$tag" snapshot-source
            docker buildx imagetools inspect "$tag" > "$manifest"
          fi
          digest="$(awk '$1 == "Digest:" && !seen++ { print $2 }' "$manifest")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'GHCR did not return a valid image digest.'; exit 1; }
          echo "SNAPSHOT_IMAGE=$SNAPSHOT_IMAGE_REPOSITORY@$digest" >> "$GITHUB_ENV"

      - name: Deploy scheduled Container Apps Job
        env:
          SNAPSHOT_SAS_URL: ${{ secrets.RIVER_SNAPSHOT_CONTAINER_SAS_URL }}
          SNAPSHOT_ALERT_EMAIL: ${{ vars.SNAPSHOT_ALERT_EMAIL || 'hello@paddletoday.com' }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          bash scripts/snapshot-worker-deployment.sh validate
          bash scripts/snapshot-worker-deployment.sh create

      - name: Start one verification execution
        id: verification
        run: |
          execution_name="$(az containerapp job start \
            --name "$AZURE_CONTAINER_APPS_JOB" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query name --output tsv)"
          [[ "$execution_name" =~ ^[a-z0-9-]+$ ]] || { echo 'Missing verification execution name'; exit 1; }
          echo "execution_name=$execution_name" >> "$GITHUB_OUTPUT"

      - name: Wait for verification execution and image identity
        env:
          SNAPSHOT_EXECUTION_NAME: ${{ steps.verification.outputs.execution_name }}
        run: node scripts/wait-for-snapshot-execution.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-verification-execution
          path: snapshot-verification-execution.json
          if-no-files-found: warn
