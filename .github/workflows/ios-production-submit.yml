name: Paddle Today iOS Production Build And Submit

on:
  workflow_dispatch:
    inputs:
      target:
        description: Store upload or unsigned native iPad layout check
        type: choice
        options: [store, ipad-simulator]
        default: store
      source_revision:
        description: Exact source commit for an iPad simulator check
        type: string
        default: c4e803d043805a3644a5263f14b10b47a758066e

concurrency:
  group: ios-production-submit
  cancel-in-progress: false

jobs:
  build_and_submit_ios_production:
    if: inputs.target != 'ipad-simulator'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_BASE_URL: https://paddletoday.com
      EXPO_PUBLIC_APP_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          # Keep CI aligned with package-lock.json and avoid breaking a build
          # when the GitHub Actions cache service is unavailable.
          eas-version: 18.13.1
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release readiness
        run: npm run mobile:release-check

      - name: Typecheck mobile app
        run: npm run mobile:typecheck

      - name: Test mobile app
        run: npm test --workspace @paddletoday/mobile

      - name: Build iOS production and submit to App Store Connect
        working-directory: apps/mobile
        run: eas build --platform ios --profile production --auto-submit --non-interactive

  ipad_simulator:
    if: inputs.target == 'ipad-simulator'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact application revision
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Select installed Xcode and production public configuration
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('source/apps/mobile/eas.json'));
          for (const [key, value] of Object.entries(config.build.production.env)) {
            if (!key.startsWith('EXPO_PUBLIC_') || /[\r\n]/.test(value)) throw Error('Unexpected configuration');
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE
      - name: Install application dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund
      - name: Build and capture native iPad simulator
        run: bash scripts/ios-ipad-simulator-check.sh "$GITHUB_WORKSPACE/source"
      - name: Upload public demo screenshots and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipad-simulator-${{ inputs.source_revision }}
          path: ${{ runner.temp }}/ipad-evidence/
          retention-days: 7
          if-no-files-found: warn
