name: Paddle Today Frontend Cutover
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, cutover, rollback-azure, rollback-worker]
        default: inspect
      source_revision:
        description: 'Exact source revision already verified on the canary'
        type: string
        default: ''
      canary_origin:
        description: 'Verified paddletoday-frontend-canary workers.dev origin'
        type: string
        default: ''
      backup_run_id:
        description: 'For rollback: this workflow run containing the original DNS backup'
        type: string
        default: ''
      worker_version_id:
        description: 'For rollback-worker: exact verified Worker version UUID'
        type: string
        default: ''
      www_worker_version_id:
        description: 'For rollback-worker: matching www redirect Worker version UUID'
        type: string
        default: ''
concurrency:
  group: frontend-production
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REVISION: ${{ inputs.source_revision || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || secrets.CLOUDFLARE_ZONE_ID }}
      SITE_URL: https://paddletoday.com
      AZURE_STORAGE_ACCOUNT: paddletoday
      AZURE_ASSET_CONTAINER: web-assets
      PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
      PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_FEATURE_TRIP_APP_HANDOFF: ${{ vars.PUBLIC_FEATURE_TRIP_APP_HANDOFF || '0' }}
      PUBLIC_FEATURE_WEB_ACCOUNT_EXPERIENCE: ${{ vars.PUBLIC_FEATURE_WEB_ACCOUNT_EXPERIENCE || '0' }}
      PUBLIC_FEATURE_SAVED_ROUTE_SYNC_CLAIM: ${{ vars.PUBLIC_FEATURE_SAVED_ROUTE_SYNC_CLAIM || '0' }}
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID || 'ce97ebc3-44ba-4c12-898e-666c904bc6b6' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - name: Checkout trusted deployment controls independently of frontend source
        if: inputs.operation != 'inspect'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .deployment-control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/cloudflare-hosting-control.mjs
            infra/cloudflare/hosting-control.mjs
            infra/cloudflare/hosting-control.test.ts
            scripts/verify-authenticated-frontend.mjs
            infra/verification/authenticated-frontend.mjs
            infra/verification/authenticated-frontend.test.ts
            vitest.config.ts
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate cutover inputs
        env:
          OPERATION: ${{ inputs.operation }}
          CANARY_ORIGIN: ${{ inputs.canary_origin }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
          WWW_WORKER_VERSION_ID: ${{ inputs.www_worker_version_id }}
        run: |
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -n "$CLOUDFLARE_API_TOKEN"
          if [ "$OPERATION" = cutover ]; then
            [[ "$CANARY_ORIGIN" =~ ^https://paddletoday-frontend-canary\.[a-z0-9-]+\.workers\.dev$ ]] || exit 1
          elif [ "$OPERATION" = rollback-azure ]; then
            [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          elif [ "$OPERATION" = rollback-worker ]; then
            [[ "$WORKER_VERSION_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]] || exit 1
            [[ "$WWW_WORKER_VERSION_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]] || exit 1
          else
            test "$OPERATION" = inspect
          fi
      - name: Verify publishing account and zone access before building
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID, zone = process.env.CLOUDFLARE_ZONE_ID;
          if (!/^[a-f0-9]{32}$/.test(zone || '') || account !== 'c8681e05144a6862baf7fbd582f6dbcc') throw new Error('Invalid publishing scope.');
          const checks = await Promise.all([
            ['zone-read', `/zones/${zone}`],
            ['dns-read', `/zones/${zone}/dns_records?per_page=1`],
            ['worker-domains-read', `/accounts/${account}/workers/domains?per_page=100`],
          ].map(async ([capability, path]) => {
            try {
              const response = await fetch('https://api.cloudflare.com/client/v4' + path, { redirect: 'error', signal: AbortSignal.timeout(15000),
                headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
              const body = await response.json();
              const scopeMatches = capability !== 'zone-read' || (body.result?.name === 'paddletoday.com' && body.result?.account?.id === account);
              return { capability, status: response.status, success: response.ok && body.success === true && scopeMatches,
                codes: body.errors?.map(error => Number(error.code) || null) };
            } catch { return { capability, status: 'unavailable', success: false }; }
          }));
          const publicEndpoints = await Promise.all([
            ['public-root', 'https://paddletoday.com/'],
            ['public-api', 'https://paddletoday.com/api/health'],
            ['azure-origin', 'https://jolly-river-0d74c2110.1.azurestaticapps.net/'],
          ].map(async ([label, url]) => {
            try {
              const response = await fetch(url, { redirect: 'manual', signal: AbortSignal.timeout(15000) });
              const hasBrand = response.status === 200 && (await response.text()).includes('Paddle Today');
              if (!response.bodyUsed) await response.body?.cancel();
              return { label, status: response.status, hasBrand, challenged: response.headers.get('cf-mitigated') === 'challenge',
                redirectsToApex: response.headers.get('location') === 'https://paddletoday.com/' };
            } catch { return { label, status: 'unavailable' }; }
          }));
          const report = { checkedAt: new Date().toISOString(), checks, publicEndpoints, readOnly: true };
          await fs.mkdir('.local/frontend-hosting', { recursive: true });
          await fs.writeFile('.local/frontend-hosting/publishing-access.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report));
          if (checks.some(check => !check.success)) process.exitCode = 1;
          NODE
      - run: npm ci
        if: inputs.operation != 'inspect'
      - name: Test hosting and rollback safeguards
        if: inputs.operation != 'inspect'
        run: |
          npx vitest run infra/cloudflare scripts/lib/api-proxy.test.ts scripts/lib/cloudflare-frontend.test.ts scripts/lib/frontend-capacity.test.ts
          npx vitest run --root .deployment-control --config "$GITHUB_WORKSPACE/.deployment-control/vitest.config.ts" infra
      - name: Verify the same source on the deployed canary
        if: inputs.operation == 'cutover'
        env:
          FRONTEND_DEPLOYMENT_STAGE: canary
          FRONTEND_CANARY_ORIGIN: ${{ inputs.canary_origin }}
          EXPECTED_FRONTEND_REVISION: ${{ env.SOURCE_REVISION }}
        run: node scripts/verify-frontend-canary.mjs
      - uses: azure/login@v2
        if: inputs.operation == 'cutover'
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Verify real authenticated requests on the exact-source canary
        if: inputs.operation == 'cutover'
        env:
          FRONTEND_AUTH_ORIGIN: ${{ inputs.canary_origin }}
        run: node .deployment-control/scripts/verify-authenticated-frontend.mjs
      - name: Prepare the production gallery and map asset release
        if: inputs.operation == 'cutover'
        run: |
          npm run prebuild:app
          node scripts/static-assets.mjs prepare
      - name: Build the complete production frontend
        if: inputs.operation == 'cutover'
        env:
          FRONTEND_DEPLOYMENT_STAGE: production
        run: |
          node scripts/assert-firebase-web-config.mjs
          npm run build:app
          cp staticwebapp.config.json dist/staticwebapp.config.json
          node scripts/static-assets.mjs package
          node scripts/prepare-cloudflare-frontend.mjs tmp/frontend
          node --import tsx scripts/audit-search-indexability.ts tmp/frontend
          node scripts/static-assets.mjs verify
      - name: Snapshot and validate the Azure DNS rollback origin
        id: snapshot
        if: inputs.operation == 'cutover'
        run: |
          node .deployment-control/scripts/cloudflare-hosting-control.mjs snapshot
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { azureOriginAvailable } from './.deployment-control/infra/cloudflare/hosting-control.mjs';
          const snapshot = JSON.parse(fs.readFileSync('.local/frontend-hosting/production-before.json'));
          if (snapshot.state !== 'azure') throw new Error('Initial cutover requires the verified Azure DNS baseline.');
          if (!await azureOriginAvailable()) throw new Error('Azure rollback origin is unavailable.');
          NODE
      - name: Save the DNS recovery backup before changing routing
        if: inputs.operation == 'cutover'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dns-backup
          path: .local/frontend-hosting/production-before.json
          overwrite: true
      - name: Prepare both Workers and verify route-write permission before DNS release
        if: inputs.operation == 'cutover'
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          for (const [name, file] of [['paddletoday-frontend', 'production'], ['paddletoday-www-redirect', 'www']]) {
            const config = JSON.parse(fs.readFileSync(`infra/cloudflare/wrangler.${file}.json`));
            if (config.name !== name) throw new Error('Unexpected production Worker name.');
            config.routes = []; config.workers_dev = false; config.preview_urls = false;
            fs.writeFileSync(`infra/cloudflare/.bootstrap-${file}.json`, JSON.stringify(config));
          }
          NODE
          npx --yes wrangler@4.158.0 deploy --config infra/cloudflare/.bootstrap-production.json --tag "$SOURCE_REVISION" | tee .local/frontend-hosting/app-bootstrap.log
          npx --yes wrangler@4.158.0 deploy --config infra/cloudflare/.bootstrap-www.json --tag "$SOURCE_REVISION" | tee .local/frontend-hosting/www-bootstrap.log
          node .deployment-control/scripts/cloudflare-hosting-control.mjs verify-versions
          node .deployment-control/scripts/cloudflare-hosting-control.mjs probe-route-write
      - name: Deploy production assets and bind only apex and www
        id: publish
        if: inputs.operation == 'cutover'
        run: |
          set -euo pipefail
          node .deployment-control/scripts/cloudflare-hosting-control.mjs release-dns paddletoday.com
          npx --yes wrangler@4.158.0 deploy --config infra/cloudflare/wrangler.production.json --tag "$SOURCE_REVISION" | tee .local/frontend-hosting/app-deploy.log
          node .deployment-control/scripts/cloudflare-hosting-control.mjs release-dns www.paddletoday.com
          npx --yes wrangler@4.158.0 deploy --config infra/cloudflare/wrangler.www.json --tag "$SOURCE_REVISION" | tee .local/frontend-hosting/www-deploy.log
      - name: Verify DNS preservation, domain ownership, and exact active Worker versions
        id: verify
        if: inputs.operation == 'cutover'
        env:
          FRONTEND_DEPLOYMENT_STAGE: production
          EXPECTED_FRONTEND_REVISION: ${{ env.SOURCE_REVISION }}
        run: |
          node .deployment-control/scripts/cloudflare-hosting-control.mjs verify
          node .deployment-control/scripts/cloudflare-hosting-control.mjs verify-versions
          echo 'Cloudflare deployment verified through its authenticated API; public CDN checks run separately from an allowed client.'
      - name: Restore Azure after a failed initial cutover
        if: failure() && inputs.operation == 'cutover' && steps.snapshot.outcome == 'success' && (steps.publish.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: node .deployment-control/scripts/cloudflare-hosting-control.mjs rollback
      - name: Roll back the production Worker to a verified version
        if: inputs.operation == 'rollback-worker'
        env:
          WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
          WWW_WORKER_VERSION_ID: ${{ inputs.www_worker_version_id }}
        run: |
          node .deployment-control/scripts/cloudflare-hosting-control.mjs guard-production
          npx --yes wrangler@4.158.0 rollback "$WORKER_VERSION_ID" --config infra/cloudflare/wrangler.production.json --yes --message 'Verified frontend recovery operation'
          npx --yes wrangler@4.158.0 rollback "$WWW_WORKER_VERSION_ID" --config infra/cloudflare/wrangler.www.json --yes --message 'Verified www recovery operation'
      - name: Verify rolled-back domain ownership and active version tags
        if: inputs.operation == 'rollback-worker'
        env:
          FRONTEND_DEPLOYMENT_STAGE: production
          EXPECTED_FRONTEND_REVISION: ${{ env.SOURCE_REVISION }}
        run: |
          node .deployment-control/scripts/cloudflare-hosting-control.mjs guard-production
          node .deployment-control/scripts/cloudflare-hosting-control.mjs verify-versions
      - name: Validate the rollback backup's workflow identity
        if: inputs.operation == 'rollback-azure'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID" > .local-rollback-run.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync('.local-rollback-run.json'));
          if (run.path !== '.github/workflows/cloudflare-frontend-cutover.yml' || run.head_repository.full_name !== process.env.GITHUB_REPOSITORY || run.head_branch !== 'main') throw new Error('Untrusted rollback backup run.');
          NODE
      - uses: actions/download-artifact@v4
        if: inputs.operation == 'rollback-azure'
        with:
          name: frontend-dns-backup
          path: .local/frontend-hosting
          github-token: ${{ github.token }}
          run-id: ${{ inputs.backup_run_id }}
      - name: Restore and verify the original Azure DNS configuration
        if: inputs.operation == 'rollback-azure'
        run: node .deployment-control/scripts/cloudflare-hosting-control.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-production-evidence
          path: .local/frontend-hosting/*
          if-no-files-found: warn
