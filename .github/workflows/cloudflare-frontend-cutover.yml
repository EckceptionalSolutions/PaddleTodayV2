name: Paddle Today Frontend Cutover
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [cutover, rollback-azure, rollback-worker]
        default: cutover
      source_revision:
        description: 'Exact source revision already verified on the canary'
        type: string
        default: ''
      canary_origin:
        description: 'Verified paddletoday-frontend-canary workers.dev origin'
        type: string
        default: ''
      backup_run_id:
        description: 'For rollback: this workflow run containing the original DNS backup'
        type: string
        default: ''
      worker_version_id:
        description: 'For rollback-worker: exact verified Worker version UUID'
        type: string
        default: ''
concurrency:
  group: frontend-production
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REVISION: ${{ inputs.source_revision || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      SITE_URL: https://paddletoday.com
      AZURE_STORAGE_ACCOUNT: paddletoday
      AZURE_ASSET_CONTAINER: web-assets
      PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
      PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_FEATURE_TRIP_APP_HANDOFF: ${{ vars.PUBLIC_FEATURE_TRIP_APP_HANDOFF || '0' }}
      PUBLIC_FEATURE_WEB_ACCOUNT_EXPERIENCE: ${{ vars.PUBLIC_FEATURE_WEB_ACCOUNT_EXPERIENCE || '0' }}
      PUBLIC_FEATURE_SAVED_ROUTE_SYNC_CLAIM: ${{ vars.PUBLIC_FEATURE_SAVED_ROUTE_SYNC_CLAIM || '0' }}
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID || 'ce97ebc3-44ba-4c12-898e-666c904bc6b6' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate cutover inputs
        env:
          OPERATION: ${{ inputs.operation }}
          CANARY_ORIGIN: ${{ inputs.canary_origin }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
        run: |
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test -n "$CLOUDFLARE_API_TOKEN"
          if [ "$OPERATION" = cutover ]; then
            [[ "$CANARY_ORIGIN" =~ ^https://paddletoday-frontend-canary\.[a-z0-9-]+\.workers\.dev$ ]] || exit 1
          elif [ "$OPERATION" = rollback-azure ]; then
            [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          else
            [[ "$WORKER_VERSION_ID" =~ ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]] || exit 1
          fi
      - run: npm ci
      - name: Test hosting and rollback safeguards
        run: npx vitest run infra/cloudflare scripts/lib/api-proxy.test.ts scripts/lib/cloudflare-frontend.test.ts scripts/lib/frontend-capacity.test.ts
      - name: Verify the same source on the deployed canary
        if: inputs.operation == 'cutover'
        env:
          FRONTEND_DEPLOYMENT_STAGE: canary
          FRONTEND_CANARY_ORIGIN: ${{ inputs.canary_origin }}
          EXPECTED_FRONTEND_REVISION: ${{ env.SOURCE_REVISION }}
        run: node scripts/verify-frontend-canary.mjs
      - name: Build the complete production frontend
        if: inputs.operation == 'cutover'
        env:
          FRONTEND_DEPLOYMENT_STAGE: production
        run: |
          npm run prebuild:app
          node scripts/static-assets.mjs prepare
          node scripts/assert-firebase-web-config.mjs
          npm run build:app
          cp staticwebapp.config.json dist/staticwebapp.config.json
          node scripts/static-assets.mjs package
          node scripts/prepare-cloudflare-frontend.mjs tmp/frontend
          node --import tsx scripts/audit-search-indexability.ts tmp/frontend
          node scripts/static-assets.mjs verify
      - name: Snapshot and validate the Azure DNS rollback origin
        id: snapshot
        if: inputs.operation == 'cutover'
        run: |
          node scripts/cloudflare-hosting-control.mjs snapshot
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const snapshot = JSON.parse(fs.readFileSync('.local/frontend-hosting/production-before.json'));
          if (snapshot.state !== 'azure') throw new Error('Initial cutover requires the verified Azure DNS baseline.');
          NODE
      - name: Deploy production assets and bind only apex and www
        id: publish
        if: inputs.operation == 'cutover'
        run: npx --yes wrangler@4.158.0 deploy --config infra/cloudflare/wrangler.production.json
      - name: Verify DNS preservation, TLS, exact revision, and production behavior
        id: verify
        if: inputs.operation == 'cutover'
        env:
          FRONTEND_DEPLOYMENT_STAGE: production
          EXPECTED_FRONTEND_REVISION: ${{ env.SOURCE_REVISION }}
        run: |
          node scripts/cloudflare-hosting-control.mjs verify
          node scripts/wait-for-frontend-release.mjs
          for origin in https://paddletoday.com https://www.paddletoday.com; do
            FRONTEND_CANARY_ORIGIN="$origin" FRONTEND_CANARY_REPORT=".local/frontend-hosting/production-$(echo "$origin" | cut -d/ -f3).json" node scripts/verify-frontend-canary.mjs
            DEPLOYMENT_BASE_URL="$origin" EXPECTED_CANONICAL_ORIGIN=https://paddletoday.com node scripts/search-serving-smoke.mjs
          done
      - name: Restore Azure after a failed initial cutover
        if: failure() && inputs.operation == 'cutover' && steps.snapshot.outcome == 'success' && (steps.publish.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: node scripts/cloudflare-hosting-control.mjs rollback
      - name: Roll back the production Worker to a verified version
        if: inputs.operation == 'rollback-worker'
        env:
          WORKER_VERSION_ID: ${{ inputs.worker_version_id }}
        run: |
          node scripts/cloudflare-hosting-control.mjs guard-production
          npx --yes wrangler@4.158.0 rollback "$WORKER_VERSION_ID" --config infra/cloudflare/wrangler.production.json --yes --message 'Verified frontend recovery operation'
      - name: Verify the rolled-back frontend revision and production behavior
        if: inputs.operation == 'rollback-worker'
        env:
          FRONTEND_DEPLOYMENT_STAGE: production
          EXPECTED_FRONTEND_REVISION: ${{ env.SOURCE_REVISION }}
        run: |
          node scripts/cloudflare-hosting-control.mjs guard-production
          node scripts/wait-for-frontend-release.mjs
          for origin in https://paddletoday.com https://www.paddletoday.com; do
            FRONTEND_CANARY_ORIGIN="$origin" FRONTEND_CANARY_REPORT=".local/frontend-hosting/production-$(echo "$origin" | cut -d/ -f3).json" node scripts/verify-frontend-canary.mjs
            DEPLOYMENT_BASE_URL="$origin" EXPECTED_CANONICAL_ORIGIN=https://paddletoday.com node scripts/search-serving-smoke.mjs
          done
      - name: Validate the rollback backup's workflow identity
        if: inputs.operation == 'rollback-azure'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID" > .local-rollback-run.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync('.local-rollback-run.json'));
          if (run.path !== '.github/workflows/cloudflare-frontend-cutover.yml' || run.head_repository.full_name !== process.env.GITHUB_REPOSITORY || run.head_branch !== 'main') throw new Error('Untrusted rollback backup run.');
          NODE
      - uses: actions/download-artifact@v4
        if: inputs.operation == 'rollback-azure'
        with:
          name: frontend-production-evidence
          path: .local/frontend-hosting
          github-token: ${{ github.token }}
          run-id: ${{ inputs.backup_run_id }}
      - name: Restore and verify the original Azure DNS configuration
        if: inputs.operation == 'rollback-azure'
        run: node scripts/cloudflare-hosting-control.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-production-evidence
          path: .local/frontend-hosting/*
          if-no-files-found: warn
