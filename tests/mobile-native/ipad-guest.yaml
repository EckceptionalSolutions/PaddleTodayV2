appId: com.paddletoday.mobile
name: Native iPad guest navigation and layout evidence
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: Today
    timeout: 60000
- takeScreenshot: 01-today
- tapOn:
    text: Explore
    index: 0
- extendedWaitUntil:
    visible: Explore
    timeout: 30000
- takeScreenshot: 02-explore
- tapOn: Weekend
- extendedWaitUntil:
    visible: Weekend
    timeout: 30000
- takeScreenshot: 03-weekend
- tapOn: Saved routes
- assertVisible: Saved routes
- takeScreenshot: 04-saved
- tapOn: Trips
- takeScreenshot: 05-trips
- tapOn: More
- assertVisible: Safety and app help
- takeScreenshot: 06-more
- openLink: paddletoday:///river/minnesota-river-le-sueur-henderson
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Minnesota River
    timeout: 30000
- takeScreenshot: 07-route
