appId: com.paddletoday.mobile
name: Native iPhone populated Explore list screenshot
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: Today's Calls
    timeout: 60000
- tapOn:
    text: Explore
    index: 0
- extendedWaitUntil:
    visible: Filters
    timeout: 30000
- tapOn: list view
- extendedWaitUntil:
    visible: Explore routes
    timeout: 30000
- assertVisible: '.*Cannon River.*'
- takeScreenshot: 03-explore
